
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1F33" />
      <stop offset="60%" stop-color="#0F2B48" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0" y1="0" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD43B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFD43B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glows -->
  <circle cx="1000" cy="150" r="400" fill="url(#goldGlow)" />
  <circle cx="200" cy="500" r="450" fill="url(#blueGlow)" />

  <!-- Grid lines overlay -->
  <g stroke="#38BDF8" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Top Badge -->
  <rect x="90" y="80" width="370" height="42" rx="21" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5" />
  <text x="115" y="107" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#93C5FD" letter-spacing="2">
    ✦ TCET ACM SIGITE STUDENT CHAPTER
  </text>

  <!-- Main Headline -->
  <text x="90" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">
    Architecting Technology,
  </text>
  <text x="90" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#FFD43B" letter-spacing="-1.5">
    Leadership & Innovation.
  </text>

  <!-- Subtitle -->
  <text x="90" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#BFDBFE">
    Thakur College of Engineering &amp; Technology's Premier ACM Chapter.
  </text>
  <text x="90" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
    Flagship Hackathons • Spatial Computing • Research Publications • Industry Visits
  </text>

  <!-- Bottom Badges / Metrics -->
  <g transform="translate(90, 480)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="220" height="74" rx="16" fill="#0F172A" fill-opacity="0.7" stroke="#334155" />
    <text x="24" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">15+ Years</text>
    <text x="24" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="1">OF EXCELLENCE</text>

    <!-- Metric 2 -->
    <rect x="240" y="0" width="220" height="74" rx="16" fill="#0F172A" fill-opacity="0.7" stroke="#334155" />
    <text x="264" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#60A5FA">10+ Events</text>
    <text x="264" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="1">ANNUAL TECH</text>

    <!-- Metric 3 -->
    <rect x="480" y="0" width="220" height="74" rx="16" fill="#0F172A" fill-opacity="0.7" stroke="#334155" />
    <text x="504" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#34D399">Top 3 National</text>
    <text x="504" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="1">CHAPTER AWARDS</text>
  </g>

  <!-- Portal URL in bottom right -->
  <text x="1110" y="530" text-anchor="end" font-family="monospace" font-size="16" font-weight="700" fill="#60A5FA">
    tcet.acm.org
  </text>
</svg>
